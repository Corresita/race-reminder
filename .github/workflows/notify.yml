name: Notify subscribers

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: "0 6 * * *"
    # And at 16:00 UTC — midnight in UTC+8, the moment Asian races open
    # at 00:00 local, so "it's open" emails land at the opening bell
    # instead of the next morning. Dedup keys make double runs safe.
    - cron: "0 16 * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run notify
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
