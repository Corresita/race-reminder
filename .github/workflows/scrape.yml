name: Update race data

on:
  schedule:
    # Every 2 hours
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run scrape -- --write
      - name: Commit updated data
        run: |
          if git diff --quiet data/races.json; then
            echo "No data changes."
          else
            git config user.name "Corresita"
            git config user.email "kuromirx@gmail.com"
            git add data/races.json
            git commit -m "Update race data from official sites"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        id: commit
      # A status flip is exactly the moment subscribers are waiting for:
      # notify right away instead of leaving it to the next cron slot.
      - name: Notify subscribers about what changed
        if: steps.commit.outputs.changed == 'true'
        run: npm run notify
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
